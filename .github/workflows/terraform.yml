name: CI de infraestructura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Ejecuta solo un plan o aplica el plan revisado."
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.15.9"

jobs:
  validate:
    name: Formato, análisis y validación Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: Instalar Checkov
        run: python -m pip install --requirement ci/requirements.txt

      - name: Instalar Terraform y comprobar su checksum
        run: |
          curl --fail --silent --show-error --location \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output "${RUNNER_TEMP}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS" \
            --output "${RUNNER_TEMP}/terraform_SHA256SUMS"
          cd "${RUNNER_TEMP}"
          grep "terraform_${TERRAFORM_VERSION}_linux_amd64.zip$" terraform_SHA256SUMS | sha256sum --check --status
          unzip -o "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -d terraform
          sudo install -m 0755 terraform/terraform /usr/local/bin/terraform
          terraform version

      - name: Comprobar formato Terraform
        run: terraform fmt -check -recursive

      - name: Analizar Terraform y Kubernetes
        run: checkov --directory . --framework terraform kubernetes --hard-fail-on HIGH,CRITICAL

      - name: Validar raíces Terraform sin conectar AWS
        run: |
          for root in bootstrap/state environments/ci environments/dev; do
            terraform -chdir="${root}" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="${root}" validate -no-color
          done

  deploy:
    name: Planificar o aplicar Terraform en AWS
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.AWS_INFRA_ROLE_ARN != '' &&
      vars.TF_STATE_BUCKET != ''
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-2
      AWS_INFRA_ROLE_ARN: ${{ vars.AWS_INFRA_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ secrets.CLUSTER_ENDPOINT_PUBLIC_ACCESS_CIDRS_JSON }}
      DEPLOY_MODE: ${{ inputs.mode }}
      INFRA_ROLE_NAME: devsu-dev-infrastructure-deployer
      CLUSTER_NAME: devsu-dev-cluster
    steps:
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Obtener credenciales temporales de AWS con OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Instalar Terraform y verificar su checksum
        run: |
          curl --fail --silent --show-error --location \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
            --output "${RUNNER_TEMP}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --fail --silent --show-error --location \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS" \
            --output "${RUNNER_TEMP}/terraform_SHA256SUMS"
          cd "${RUNNER_TEMP}"
          grep "terraform_${TERRAFORM_VERSION}_linux_amd64.zip$" terraform_SHA256SUMS \
            | sha256sum --check --status
          unzip -o "terraform_${TERRAFORM_VERSION}_linux_amd64.zip" -d terraform
          sudo install -m 0755 terraform/terraform /usr/local/bin/terraform
          terraform version

      - name: Revisar la configuración del despliegue
        run: |
          test -n "${AWS_INFRA_ROLE_ARN}"
          test -n "${TF_STATE_BUCKET}"
          test -n "${TF_VAR_cluster_endpoint_public_access_cidrs}"
          if [[ "${DEPLOY_MODE}" != "plan" && "${DEPLOY_MODE}" != "apply" ]]; then
            echo "Selecciona plan o apply en el formulario de GitHub Actions." >&2
            exit 1
          fi

      - name: Planificar y, si se seleccionó, aplicar los cambios
        run: |
          set -euo pipefail

          plan_root() {
            local root="$1"
            local key="$2"
            local plan_name="$3"
            local plan_file="${RUNNER_TEMP}/${plan_name}"

            terraform -chdir="${root}" init \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${key}" \
              -backend-config="region=${AWS_REGION}" \
              -backend-config="encrypt=true" \
              -backend-config="use_lockfile=true" \
              -input=false
            terraform -chdir="${root}" plan \
              -input=false \
              -no-color \
              -out="${plan_file}"

            echo "Plan de Terraform para ${root}:"
            terraform -chdir="${root}" show -no-color "${plan_file}"

            if terraform -chdir="${root}" show -json "${plan_file}" \
              | jq --exit-status '[.resource_changes[]?.change.actions[]? | select(. == "delete")] | length > 0' \
                >/dev/null; then
              echo "El plan de ${root} contiene eliminaciones o reemplazos; se detiene para revisión." >&2
              exit 1
            fi

            if [[ "${DEPLOY_MODE}" == "apply" ]]; then
              terraform -chdir="${root}" apply -input=false -auto-approve "${plan_file}"
            else
              echo "Modo plan: los cambios se muestran, pero no se aplican."
            fi
          }

          plan_root bootstrap/state devsu/bootstrap/state/terraform.tfstate bootstrap.tfplan

          terraform -chdir=environments/ci init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=devsu/ci/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -input=false

          if ! terraform -chdir=environments/ci state list \
            | grep --fixed-strings --line-regexp \
              'module.github_actions.aws_iam_role.infrastructure_deployer' >/dev/null; then
            terraform -chdir=environments/ci import -input=false \
              module.github_actions.aws_iam_role.infrastructure_deployer \
              "${INFRA_ROLE_NAME}"
          fi

          if ! terraform -chdir=environments/ci state list \
            | grep --fixed-strings --line-regexp \
              'module.github_actions.aws_iam_role_policy_attachment.infrastructure_deployer_power_user' \
              >/dev/null; then
            terraform -chdir=environments/ci import -input=false \
              module.github_actions.aws_iam_role_policy_attachment.infrastructure_deployer_power_user \
              "${INFRA_ROLE_NAME}/arn:aws:iam::aws:policy/PowerUserAccess"
          fi

          if ! terraform -chdir=environments/ci state list \
            | grep --fixed-strings --line-regexp \
              'module.github_actions.aws_iam_role_policy.infrastructure_deployer' >/dev/null; then
            terraform -chdir=environments/ci import -input=false \
              module.github_actions.aws_iam_role_policy.infrastructure_deployer \
              "${INFRA_ROLE_NAME}:${INFRA_ROLE_NAME}"
          fi

          plan_root environments/ci devsu/ci/terraform.tfstate ci.tfplan
          plan_root environments/dev devsu/dev/terraform.tfstate dev.tfplan

      - name: Autorizar temporalmente la IP del runner en EKS
        id: eks_runner_access
        if: ${{ inputs.mode == 'apply' }}
        run: bash ci/scripts/manage-eks-runner-cidr.sh add "${CLUSTER_NAME}" "${AWS_REGION}"

      - name: Aplicar RBAC limitado de la API
        if: ${{ inputs.mode == 'apply' }}
        run: |
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"
          for attempt in $(seq 1 12); do
            if kubectl auth can-i create rolebindings --namespace devsu; then
              break
            fi
            if (( attempt == 12 )); then
              echo "El rol de infraestructura todavía no puede administrar el clúster." >&2
              exit 1
            fi
            sleep 5
          done
          kubectl apply --filename kubernetes/dev/deployer-rbac.yaml

      - name: Retirar la IP temporal del runner de EKS
        if: ${{ always() && steps.eks_runner_access.outputs.changed == 'true' }}
        env:
          RUNNER_CIDR: ${{ steps.eks_runner_access.outputs.runner_cidr }}
        run: bash ci/scripts/manage-eks-runner-cidr.sh remove "${CLUSTER_NAME}" "${AWS_REGION}" "${RUNNER_CIDR}"
