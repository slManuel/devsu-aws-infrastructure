apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devsu-api-runtime
  namespace: devsu
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: devsu-aws-secrets
    kind: SecretStore
  target:
    name: devsu-api-runtime
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: devsu-dev/api-runtime
        property: DJANGO_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: devsu-dev/api-runtime
        property: DATABASE_URL
